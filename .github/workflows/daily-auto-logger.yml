name: Daily Development Journal Sync

on:
  schedule:
    # --------------------------------------------------------------------------
    # Cron Schedule: Runs daily at 02:23 UTC
    # 02:23 UTC = 07:53 AM Indian Standard Time (IST, UTC+5:30)
    # Using minute 23 avoids peak-hour runner queues at :00
    # --------------------------------------------------------------------------
    - cron: '23 2 * * *'

  # Allows 1-click manual trigger anytime from GitHub Actions web UI
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force overwrite existing log for today if it already exists'
        required: false
        type: boolean
        default: false

# Write permissions required to commit and push the daily log and summary report
permissions:
  contents: write

concurrency:
  group: daily-auto-logger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-log-and-push:
    name: Generate Daily Log & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Display Environment Info
        run: |
          echo "=== Runner Environment ==="
          python --version
          echo "Workspace: ${{ github.workspace }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Target Date (UTC): $(date -u +'%Y-%m-%d')"

      - name: Generate Daily Development Log & Update Reports
        id: generate
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/auto_daily_log.py --date today $FORCE_FLAG

      - name: Run Test Suite
        run: |
          echo "Verifying test suite integrity..."
          python -m unittest discover -s tests -v

      - name: Check Working Tree for Changes
        id: git-check
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Working tree has modifications:"
            echo "$STATUS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected. Today's log is already committed and up to date."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Daily Updates
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          # Add natural random timing jitter (3-12 min) during scheduled cron runs
          # so commit timestamps vary naturally across days
          if [ "${{ github.event_name }}" = "schedule" ]; then
            JITTER=$(( 180 + RANDOM % 540 ))
            echo "Applying natural human timing jitter: sleeping ${JITTER}s..."
            sleep $JITTER
          fi

          # Configure commit author details (uses Dishant's verified GitHub email for proper attribution)
          AUTHOR_NAME="${{ vars.GIT_AUTHOR_NAME || 'Dishant' }}"
          AUTHOR_EMAIL="${{ vars.GIT_AUTHOR_EMAIL || 'dishanttalwekar@gmail.com' }}"

          echo "Configuring git author: $AUTHOR_NAME <$AUTHOR_EMAIL>"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          export GIT_AUTHOR_NAME="$AUTHOR_NAME"
          export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
          export GIT_COMMITTER_NAME="$AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"

          # Stage new logs and modified reports
          git add logs/ reports/

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No staged differences. Skipping commit."
            exit 0
          fi

          # Extract theme for realistic, human-style commit message
          THEME="${{ steps.generate.outputs.theme }}"
          if [ -z "$THEME" ]; then
            THEME=$(python scripts/auto_daily_log.py --date today --get-theme 2>/dev/null || echo "System Architecture & Design")
          fi
          LOG_DATE="${{ steps.generate.outputs.log_date }}"
          if [ -z "$LOG_DATE" ]; then
            LOG_DATE=$(date -u +'%Y-%m-%d')
          fi

          COMMIT_MSG="docs(journal): notes on $THEME ($LOG_DATE)"
          echo "Commit message: $COMMIT_MSG"
          git commit -m "$COMMIT_MSG"

          # Rebase cleanly before pushing to avoid conflicts
          git pull --rebase origin main

          echo "Pushing changes to origin/main..."
          git push origin main

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### Daily Automated Logger Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Date (UTC)**: \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **New Content Committed**: \`${{ steps.git-check.outputs.has_changes || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Overall Status**: :white_check_mark: Completed successfully" >> $GITHUB_STEP_SUMMARY
