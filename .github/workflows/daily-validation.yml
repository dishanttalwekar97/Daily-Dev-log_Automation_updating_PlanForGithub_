name: Daily Development Log Validation

on:
  schedule:
    # --------------------------------------------------------------------------
    # Cron Schedule: Runs every day at 12:30 UTC
    # 12:30 UTC corresponds to 18:00 (6:00 PM) Indian Standard Time (IST, UTC+5:30).
    # Format: <minute> <hour> <day-of-month> <month> <day-of-week>
    # Note: GitHub Actions interprets schedules in UTC. During periods of high
    # platform load, scheduled workflows may experience execution delays.
    # To modify the schedule, adjust the hour and minute values below.
    # --------------------------------------------------------------------------
    - cron: '30 12 * * *'

  # Enables manual trigger from the GitHub Actions web UI or GitHub CLI
  workflow_dispatch:

# Enforce least-privilege permissions across the entire workflow
permissions:
  contents: read

# Concurrency group ensures only one validation run per ref runs at a time
concurrency:
  group: daily-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-journal:
    name: Validate Daily Development Logs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner Environment
        # Read-only repository checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Display Environment Info
        run: |
          echo "=== Runner Environment ==="
          python --version
          echo "Workspace: ${{ github.workspace }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Validate Markdown Logs
        id: validate
        run: |
          echo "Running development journal validation..."
          python scripts/validate_log.py --dir logs

      - name: Check for Duplicate Dates and Content
        id: duplicates
        run: |
          echo "Checking for duplicate dates, collisions, and copy-pasted entries..."
          python scripts/check_duplicates.py --dir logs

      - name: Generate Summary Report
        if: always()
        run: |
          echo "### Daily Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation Exit Code**: \`${{ steps.validate.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Integrity Check Exit Code**: \`${{ steps.duplicates.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed at (UTC)**: \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`" >> $GITHUB_STEP_SUMMARY
